options:
  watch-namespace:
    type: string
    default: ""
    description: |
      Namespaces KEDA restricts its watch to. Empty (the default) means
      cluster-wide: KEDA reconciles ScaledObjects in every namespace. Set to a
      single namespace name, or a comma-separated list of namespaces, to scope
      KEDA to those namespaces only.
  log-level:
    type: string
    default: info
    description: |
      Log level for the KEDA operator. One of: debug, info, error, or any
      integer value greater than 0.
