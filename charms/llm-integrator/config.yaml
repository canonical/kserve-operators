options:
  model-uri:
    type: string
    default: ""
    description: >
      URI of the model to deploy. Two schemes are supported: Hugging Face URIs
      (hf://), e.g. hf://meta-llama/Llama-3.1-8B-Instruct, and S3 URIs (s3://),
      e.g. s3://my-bucket/models/llama-3.1-8b. When an s3:// URI is used the
      charm must be related to an s3-integrator over the s3-credentials endpoint
      to obtain the bucket credentials.
  model-name:
    type: string
    default: ""
    description: >
      Optional name the served model is exposed as (spec.model.name of the
      LLMInferenceService), e.g. llama-3.1-8b. When left empty it defaults to
      the model reference derived from model-uri: the part after hf:// for
      Hugging Face URIs, or the last path segment of the bucket key for s3://
      URIs.
  runtime-image:
    type: string
    default: ""
    description: >
      Optional OCI image override for the vLLM serving runtime container. When
      empty, the charm uses the vLLM image it ships for the selected
      accelerator. A custom image must match the accelerator (e.g. a CUDA build
      for nvidia-gpu); a mismatch is not detected and only fails at pod start.
  accelerator:
    type: string
    default: "cpu"
    description: >
      Hardware the model runs on: "cpu" or "nvidia-gpu". Selects the default
      runtime image, resource defaults and vLLM settings. With "nvidia-gpu" the
      cluster must advertise nvidia.com/gpu (e.g. via the NVIDIA GPU operator)
      and GPU nodes must not be tainted.
  gpu-count:
    type: int
    default: 1
    description: >
      Number of GPUs per worker pod (nvidia.com/gpu). Values above 1 also set
      vLLM's --tensor-parallel-size. Ignored when accelerator is "cpu".
  cpu-request:
    type: string
    default: ""
    description: >
      CPU request per worker, as a Kubernetes quantity (e.g. "4" or "500m").
      When empty, the default for the selected accelerator is used.
  cpu-limit:
    type: string
    default: ""
    description: >
      CPU limit per worker, as a Kubernetes quantity. When empty, the default
      for the selected accelerator is used.
  memory-request:
    type: string
    default: ""
    description: >
      Memory request per worker, as a Kubernetes quantity (e.g. "16Gi"). When
      empty, the default for the selected accelerator is used.
  memory-limit:
    type: string
    default: ""
    description: >
      Memory limit per worker, as a Kubernetes quantity. When empty, the default
      for the selected accelerator is used.
  max-model-len:
    type: int
    default: 0
    description: >
      Maximum model context length passed to vLLM as --max-model-len. 0 keeps
      the model's own value. Useful to fit large-context models on smaller GPUs.
  gpu-memory-utilization:
    type: float
    default: 0.0
    description: >
      Fraction of GPU memory vLLM may use, in (0, 1], passed as
      --gpu-memory-utilization. 0 keeps vLLM's default (0.9). Required when
      several models share one GPU (time-slicing or MPS). Ignored when
      accelerator is "cpu".
  vllm-extra-args:
    type: string
    default: ""
    description: >
      Extra arguments appended to `vllm serve`, e.g.
      "--dtype bfloat16 --enable-prefix-caching". Parsed with shell-like
      quoting but never run through a shell. Flags managed by the charm
      (--port, --served-model-name, --tensor-parallel-size, --max-model-len,
      --gpu-memory-utilization) and --kv-transfer-config are rejected.
  storage-initializer-image:
    type: string
    default: "docker.io/charmedkubeflow/storage-initializer:0.17.0-07d37fb"
    description: >
      OCI image used for the storage-initializer init container that downloads
      the model into the workload, for both hf:// and s3:// model URIs.
  hf-token-secret:
    type: secret
    description: >
      URI of a Juju user secret holding the Hugging Face access token used to
      download gated or private hf:// models. The secret must expose the token
      under a "token" key. Create and grant it before configuring, e.g.
      `juju add-secret my-hf-token token=hf_xxx` then
      `juju grant-secret my-hf-token llm-integrator`, and set this option to the
      resulting `secret:...` URI. Only used with hf:// model URIs; leave unset
      for public models.
  enable-prefill-decode:
    type: boolean
    default: false
    description: >
      Deploy the model in prefill/decode (disaggregated) mode, adding a
      dedicated prefill worker alongside the decode worker. The decode worker
      recomputes the prompt (no KV-cache transfer). With "nvidia-gpu" the
      cluster must fit two workers of gpu-count GPUs each. When false, the
      model is deployed as a single colocated worker.
