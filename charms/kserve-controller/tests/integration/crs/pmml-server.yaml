apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: "pmml-demo"
spec:
  predictor:
    serviceAccountName: kserve-test-models-s3
    model:
      modelFormat:
        name: pmml
      storageUri: "s3://charmed-kubeflow-llm-storage/kserve-controller-models/pmml"
      resources:
        limits:
          cpu: 1
          memory: 500Mi
        requests:
          cpu: 100m
          memory: 250Mi
