apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: "paddle-resnet50"
spec:
  predictor:
    serviceAccountName: kserve-test-models-s3
    model:
      modelFormat:
        name: paddle
      storageUri: "s3://charmed-kubeflow-llm-storage/kserve-controller-models/paddle/resnet"
      resources:
        limits:
          cpu: 1
          memory: 500Mi
        requests:
          cpu: 100m
          memory: 250Mi
