juju:
  channel: 3.6/stable
  model-defaults:
    logging-config: <root>=INFO; unit=DEBUG

providers:
  k8s:
    enable: true
    bootstrap: true
    channel: 1.32-classic/stable
    features:
      local-storage:
      load-balancer:
        enabled: true
        l2-mode: true
        # /29 (8 addresses) so both the KServe gateway and cos-lite's traefik can
        # each get a LoadBalancer IP (the observability test needs a second one).
        cidrs: 10.64.140.40/29
    bootstrap-constraints:
      root-disk: 2G

  lxd:
    enable: true
    bootstrap: false
    channel: latest/stable

host:
  snaps:
    charmcraft:
      channel: 3.x/stable
