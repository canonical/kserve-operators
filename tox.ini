[flake8]
max-line-length = 100

[tox]
skipsdist = True
skip_missing_interpreters = True
envlist = {kserve-controller,kserve-llmisvc,llm-integrator,keda-controller}-{unit,lint},kserve-controller-{integration-object-storage,integration-ambient,integration-s3},keda-controller-integration,keda-controller-integration-observability,lint,bundle-integration,bundle-keda-integration,cos-integration
[vars]
all_path = {[vars]src_path} {[vars]tst_path}
src_path = {toxinidir}/src/
tst_path = {toxinidir}/tests/

[testenv]
allowlist_externals =
	tox
setenv =
	PY_COLORS = 1
	kserve-controller: CHARM_DIR = kserve-controller
	kserve-llmisvc: CHARM_DIR = kserve-llmisvc
	llm-integrator: CHARM_DIR = llm-integrator
	keda-controller: CHARM_DIR = keda-controller
	fmt: TYPE = fmt
	unit: TYPE = unit
	lint: TYPE = lint
	integration: TYPE = integration
	integration-observability: TYPE = integration-observability
	integration-s3: TYPE = integration-s3
	integration-object-storage: TYPE = integration-object-storage
	integration-ambient: TYPE = integration-ambient
commands =
	tox -c charms/{env:CHARM_DIR} -e {env:TYPE} -- {posargs}
deps =
	poetry>=2.1.3

[testenv:fmt]
commands =
	isort {[vars]tst_path}
	black {[vars]tst_path}
description = Apply coding style standards to code
commands_pre =
	poetry install --only fmt
skip_install = true

[testenv:lint]
commands =
	flake8 {[vars]tst_path}
	isort --check-only --diff {[vars]tst_path}
	black --check --diff {[vars]tst_path}
description = Check code against coding style standards
commands_pre =
	poetry install --only lint
skip_install = true

[testenv:bundle-integration]
description = Run bundle integration tests with both charms and external Helm-managed infra
passenv =
	AWS_ACCESS_KEY_ID
	AWS_SECRET_ACCESS_KEY
	AWS_DEFAULT_REGION
	S3_ENDPOINT
	TEST_MODEL_S3_URI
	HF_TOKEN
commands =
	pytest -vv --tb=native -s --log-cli-level=INFO {[vars]tst_path}integration/test_bundle.py {posargs}
commands_pre =
	poetry install --only integration
skip_install = true

[testenv:bundle-integration-gpu]
description = Run bundle integration tests including the GPU LLMInferenceService example
passenv =
	AWS_ACCESS_KEY_ID
	AWS_SECRET_ACCESS_KEY
	AWS_DEFAULT_REGION
	S3_ENDPOINT
	TEST_MODEL_S3_URI
	HF_TOKEN
commands =
	pytest -vv --tb=native -s --log-cli-level=INFO {[vars]tst_path}integration/test_bundle.py --run-gpu-tests {posargs}
commands_pre =
	poetry install --only integration
skip_install = true

[testenv:bundle-keda-integration]
description = Run the KEDA bundle integration test (serving stack + keda charm scales an LLMInferenceService on a Prometheus metric)
passenv =
	AWS_ACCESS_KEY_ID
	AWS_SECRET_ACCESS_KEY
	AWS_DEFAULT_REGION
	S3_ENDPOINT
	TEST_MODEL_S3_URI
commands =
	pytest -vv --tb=native -s --log-cli-level=INFO {[vars]tst_path}integration/test_bundle_keda.py {posargs}
commands_pre =
	poetry install --only integration
skip_install = true

[testenv:cos-integration]
description = Run the observability integration test (deploys cos-lite; heavy)
passenv =
	AWS_ACCESS_KEY_ID
	AWS_SECRET_ACCESS_KEY
	AWS_DEFAULT_REGION
	S3_ENDPOINT
	TEST_MODEL_S3_URI
commands =
	pytest -vv --tb=native -s --log-cli-level=INFO {[vars]tst_path}integration/test_observability.py {posargs}
commands_pre =
	poetry install --only integration
skip_install = true

[testenv:update-requirements]
commands =
	# updating all groups' locked dependencies:
	poetry lock --regenerate
	# updating all groups' locked dependencies for every charm subfolder:
	find charms/ -maxdepth 1 -mindepth 1 -type d -exec bash -c "cd {} && poetry lock --regenerate" \;
description = Update requirements, including those in charm subfolders
allowlist_externals = find
skip_install = true
