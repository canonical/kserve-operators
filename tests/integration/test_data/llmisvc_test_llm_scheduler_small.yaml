apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: test-llm-scheduler-small
  namespace: default
spec:
  model:
    uri: s3://charmed-kubeflow-llm-storage/pythia-70m
    name: EleutherAI/pythia-70m
  storageInitializer:
    enabled: false
  replicas: 1
  router:
    scheduler: {}
    route: {}
  template:
    volumes:
      - name: kserve-pvc-source
        emptyDir: {}
    initContainers:
      - name: storage-initializer
        image: kserve/storage-initializer:v0.17.0
        args:
          - s3://charmed-kubeflow-llm-storage/pythia-70m
          - /mnt/models
        # NOTE: manual scratch file. Fill in the AWS credentials below before
        # `kubectl apply`. Do NOT commit real credentials.
        env:
          - name: AWS_ACCESS_KEY_ID
            value: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
          - name: AWS_SECRET_ACCESS_KEY
            value: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
          - name: AWS_DEFAULT_REGION
            value: "eu-central-1"
          - name: S3_ENDPOINT
            value: "s3.eu-central-1.amazonaws.com"
          - name: S3_USE_HTTPS
            value: "1"
          - name: S3_VERIFY_SSL
            value: "1"
        volumeMounts:
          - name: kserve-pvc-source
            mountPath: /mnt/models
    containers:
      - name: main
        image: quay.io/pierdipi/vllm-cpu:latest
        securityContext:
          runAsNonRoot: false
        env:
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "1"
        volumeMounts:
          - name: kserve-pvc-source
            mountPath: /mnt/models
            readOnly: true
        resources:
          requests:
            cpu: "500m"
            memory: "3Gi"
          limits:
            cpu: "2"
            memory: "8Gi"
