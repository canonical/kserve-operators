name: Set up GPU + InfiniBand cluster on Testflinger
description: >-
  Reserves the Testflinger GPU workers (prepared by the job's test phase), forms a
  Canonical K8s (snap) cluster, deploys the NVIDIA GPU Operator and the NVIDIA
  Network Operator (verified with ib_send_bw), then bootstraps a Juju controller
  inside the K8s cluster. This host is the orchestrator; always pair
  with the `release` action in an `if: always()` step.

inputs:
  ssh-import-ids:
    description: "Space/comma separated lp:/gh: identities with SSH access to the reserved machines"
    required: true
  testflinger-client-id:
    description: Testflinger client ID
    required: false
    default: ""
  testflinger-secret-key:
    description: Testflinger secret key
    required: false
    default: ""
  cluster:
    description: Testflinger cluster spec name (testflinger/cluster-specs/<cluster>.yaml)
    required: false
    default: tor-A100_x2_IB
  reservation-timeout-hours:
    description: How long the machines stay reserved (upper bound, released earlier by the release action)
    required: false
    default: "6"
  acquire-timeout-hours:
    description: Max time to wait for the agents to become available
    required: false
    default: "43"
  juju-channel:
    description: Juju snap channel
    required: false
    default: 3.6/stable
  k8s-channel:
    description: k8s snap channel
    required: false
    default: 1.34-classic/stable
  gpu-operator-version:
    description: NVIDIA GPU Operator Helm chart version
    required: false
    default: v26.7.2
  network-operator-version:
    description: NVIDIA Network Operator Helm chart version
    required: false
    default: 26.7.0
  up-to:
    description: "Last operator stage to set up: k8s, gpu-operator or network-operator"
    required: false
    default: network-operator
  vllm-controller:
    description: >-
      Bootstrap the Juju controller inside K8s after the operator stages
      ("true"/"false"); needed by the tests
    required: false
    default: "true"
  job-priority-overrides:
    description: >-
      Submit with the job_priority values of testflinger/job-configs/agent-job-overrides.yaml
      (the Testflinger client must be allowed to use them)
    required: false
    default: "false"
  tmate:
    description: >-
      Open a detached canonical/action-tmate session on the runner before the
      K8s deployment ("true"/"false"); the job waits for it to be closed at the end
    required: false
    default: "false"
  vllm-controller-name:
    description: Name of the Juju controller bootstrapped inside the K8s cluster
    required: false
    default: vllm

outputs:
  state-dir:
    description: Directory with the cluster state (job data, kubeconfig, ephemeral key)
    value: ${{ steps.env.outputs.state-dir }}
  kubeconfig:
    description: Path to the admin kubeconfig of the K8s cluster
    value: ${{ steps.env.outputs.kubeconfig }}
  workers:
    description: JSON array of user@ip of the GPU workers
    value: ${{ steps.reserve.outputs.workers }}
  vllm-controller:
    description: Name of the Juju controller inside the K8s cluster (current controller)
    value: ${{ steps.vllm.outputs.vllm_controller }}

runs:
  using: composite
  steps:
    - name: Export cluster environment
      id: env
      shell: bash
      env:
        IN_CLUSTER: ${{ inputs.cluster }}
        IN_SSH_IMPORT_IDS: ${{ inputs.ssh-import-ids }}
        IN_RESERVATION_HOURS: ${{ inputs.reservation-timeout-hours }}
        IN_ACQUIRE_HOURS: ${{ inputs.acquire-timeout-hours }}
        IN_JUJU_CHANNEL: ${{ inputs.juju-channel }}
        IN_K8S_CHANNEL: ${{ inputs.k8s-channel }}
        IN_GPU_OPERATOR_VERSION: ${{ inputs.gpu-operator-version }}
        IN_NETWORK_OPERATOR_VERSION: ${{ inputs.network-operator-version }}
        IN_VLLM_CONTROLLER_NAME: ${{ inputs.vllm-controller-name }}
        IN_JOB_PRIORITY_OVERRIDES: ${{ inputs.job-priority-overrides }}
        IN_UP_TO: ${{ inputs.up-to }}
      run: |
        set -euo pipefail
        for v in IN_RESERVATION_HOURS IN_ACQUIRE_HOURS; do
          [[ "${!v}" =~ ^[0-9]+$ ]] || { echo "::error::$v must be a whole number of hours"; exit 1; }
        done
        [[ "$IN_UP_TO" =~ ^(k8s|gpu-operator|network-operator)$ ]] \
          || { echo "::error::up-to must be one of k8s, gpu-operator, network-operator"; exit 1; }
        state_dir="$HOME/gpu-ib-cluster-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        {
          echo "STATE_DIR=$state_dir"
          echo "KUBECONFIG=$state_dir/kubeconfig"
          echo "CLUSTER=$IN_CLUSTER"
          echo "SSH_IMPORT_IDS=$IN_SSH_IMPORT_IDS"
          echo "RESERVATION_TIMEOUT_SECONDS=$(( IN_RESERVATION_HOURS * 3600 ))"
          echo "ACQUIRE_TIMEOUT_SECONDS=$(( IN_ACQUIRE_HOURS * 3600 ))"
          echo "JUJU_CHANNEL=$IN_JUJU_CHANNEL"
          echo "K8S_CHANNEL=$IN_K8S_CHANNEL"
          echo "GPU_OPERATOR_VERSION=$IN_GPU_OPERATOR_VERSION"
          echo "NETWORK_OPERATOR_VERSION=$IN_NETWORK_OPERATOR_VERSION"
          echo "VLLM_CONTROLLER_NAME=$IN_VLLM_CONTROLLER_NAME"
          echo "JOB_PRIORITY_OVERRIDES=$IN_JOB_PRIORITY_OVERRIDES"
        } >> "$GITHUB_ENV"
        echo "state-dir=$state_dir" >> "$GITHUB_OUTPUT"
        echo "kubeconfig=$state_dir/kubeconfig" >> "$GITHUB_OUTPUT"

    - name: Install prerequisites
      shell: bash
      run: ${{ github.action_path }}/../scripts/00-install-prereqs.sh

    - name: Reserve Testflinger machines
      id: reserve
      shell: bash
      env:
        TESTFLINGER_CLIENT_ID: ${{ inputs.testflinger-client-id }}
        TESTFLINGER_SECRET_KEY: ${{ inputs.testflinger-secret-key }}
      run: ${{ github.action_path }}/../scripts/01-reserve-machines.sh

    - name: Setup tmate session (detached)
      if: inputs.tmate == 'true'
      uses: canonical/action-tmate@main
      with:
        detached: true

    - name: Deploy Canonical K8s
      shell: bash
      run: ${{ github.action_path }}/../scripts/02-deploy-k8s.sh

    - name: Deploy NVIDIA GPU Operator
      if: inputs.up-to != 'k8s'
      shell: bash
      run: ${{ github.action_path }}/../scripts/03-deploy-gpu-operator.sh

    - name: Deploy NVIDIA Network Operator and verify InfiniBand
      if: inputs.up-to == 'network-operator'
      shell: bash
      run: ${{ github.action_path }}/../scripts/04-deploy-network-operator.sh

    - name: Bootstrap Juju controller in K8s
      id: vllm
      if: inputs.vllm-controller == 'true'
      shell: bash
      run: ${{ github.action_path }}/../scripts/05-bootstrap-vllm-controller.sh

    - name: Write job summary
      if: always()
      shell: bash
      run: |
        source "${{ github.action_path }}/../scripts/env.sh"
        [[ -s "$JOB_DATA_PATH" ]] && command -v yq >/dev/null || exit 0
        {
          echo "### Testflinger cluster \`$CLUSTER\`"
          echo
          echo "| Agent | Job | Address |"
          echo "|---|---|---|"
          yq -r '.[] | "| " + (.agent // "?") + " | [" + .job_id + "](https://testflinger.canonical.com/jobs/" + .job_id + ") | " + ((.username // "") + "@" + (.IP // "pending")) + " |"' "$JOB_DATA_PATH"
          echo
          echo "SSH access: \`${SSH_IMPORT_IDS}\` (e.g. \`ssh ubuntu@<address>\`)."
        } >> "$GITHUB_STEP_SUMMARY"
