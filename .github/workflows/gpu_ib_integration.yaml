name: GPU + InfiniBand integration tests

# Reserves real GPU machines connected via InfiniBand on Testflinger, builds a
# Canonical K8s cluster with the NVIDIA GPU and Network Operators on them,
# bootstraps a Juju controller in it and runs the GPU bundle integration tests
# against the charms packed from the dispatched ref.
# See .github/actions/gpu-ib-cluster/README.md.
#
# workflow_dispatch only: it uses a self-hosted runner and lab hardware, so it
# must never run on (fork) pull requests.

on:
  # TEMPORARY (revert before merge): workflow_dispatch needs the workflow on
  # main, so the first runs are triggered by pushes to the feature branch.
  # Push runs set up the whole stack on tor-A100_x2_IB (K8s, GPU and Network
  # Operators, vllm Juju controller), run the GPU tests and keep the reservation.
  push:
    branches:
      - ci/gpu-ib-integration
  workflow_dispatch:
    inputs:
      cluster:
        description: Testflinger cluster spec (.github/actions/gpu-ib-cluster/testflinger/cluster-specs)
        required: false
        default: tor-A100_x2_IB
        type: choice
        options:
          - tor-A100_x2_IB
          - tor-k8s-smoke
      up-to:
        description: Last operator stage (the tests need at least gpu-operator)
        required: false
        default: network-operator
        type: choice
        options:
          - k8s
          - gpu-operator
          - network-operator
      ssh-import-ids:
        description: "lp:/gh: identities (space separated) with SSH access to the machines; gh:<triggering user> is always added"
        required: true
        default: lp:dariofaccin
        type: string
      tmate:
        description: Open a detached tmate session on the runner before the K8s deployment
        required: false
        default: false
        type: boolean
      keep-reservation:
        description: Keep the machines after the run (debugging); they are released at the reservation timeout
        required: false
        default: true
        type: boolean
      reservation-timeout-hours:
        description: Testflinger reservation timeout in hours (upper bound of a kept reservation)
        required: false
        default: "6"
        type: string
      run-tests:
        description: Run the GPU integration tests (tor-A100_x2_IB only; false = only build the infrastructure)
        required: false
        default: true
        type: boolean
      pytest-args:
        description: Extra pytest arguments, e.g. "-k gpu"
        required: false
        default: ""
        type: string
      juju-channel:
        description: Juju snap channel
        required: false
        default: 3.6/stable
        type: string
      k8s-channel:
        description: k8s snap channel
        required: false
        default: 1.34-classic/stable
        type: string
      gpu-operator-version:
        description: NVIDIA GPU Operator Helm chart version
        required: false
        default: v26.7.2
        type: string
      network-operator-version:
        description: NVIDIA Network Operator Helm chart version
        required: false
        default: 26.7.0
        type: string

# One run at a time per Testflinger cluster: runs queue instead of competing
# for the same agents.
concurrency:
  group: gpu-ib-${{ inputs.cluster || 'tor-A100_x2_IB' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  get-charm-paths:
    name: Get charm paths
    if: github.event_name == 'push' || (inputs.cluster == 'tor-A100_x2_IB' && inputs.run-tests && inputs.up-to != 'k8s')
    runs-on: ubuntu-latest
    outputs:
      charm-paths: ${{ steps.get-charm-paths.outputs.charm-paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get paths for all charms in this repo
        id: get-charm-paths
        uses: canonical/kubeflow-ci/actions/get-charm-paths@main

  build:
    strategy:
      matrix:
        charm: ${{ fromJSON(needs.get-charm-paths.outputs.charm-paths) }}
    name: Build charm | ${{ matrix.charm }}
    if: github.event_name == 'push' || (inputs.cluster == 'tor-A100_x2_IB' && inputs.run-tests && inputs.up-to != 'k8s')
    needs:
      - get-charm-paths
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v53.0.0
    with:
      path-to-charm-directory: ${{ matrix.charm }}
      cache: true
    permissions:
      actions: read
      contents: read

  gpu-ib-integration:
    name: GPU + InfiniBand integration tests
    needs:
      - build
    # The build is skipped when not running the tests.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: [self-hosted, self-hosted-linux-amd64-jammy-private-endpoint-medium]
    # Includes waiting for the Testflinger agents to be free.
    timeout-minutes: 2880
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # The GitHub user who triggered (or re-ran) the workflow also gets SSH
      # access to the machines, on top of the ssh-import-ids input.
      - name: Collect SSH identities
        id: ssh-ids
        env:
          IDS: ${{ inputs.ssh-import-ids || 'lp:dariofaccin' }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ -n "$ACTOR" && "$ACTOR" != *"[bot]" ]]; then
            IDS="$IDS gh:$ACTOR"
          fi
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: Set up cluster
        id: setup
        uses: ./.github/actions/gpu-ib-cluster/setup
        with:
          ssh-import-ids: ${{ steps.ssh-ids.outputs.ids }}
          cluster: ${{ inputs.cluster || 'tor-A100_x2_IB' }}
          up-to: ${{ inputs.up-to || 'network-operator' }}
          testflinger-client-id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          testflinger-secret-key: ${{ secrets.TESTFLINGER_SECRET_KEY }}
          job-priority-overrides: true
          reservation-timeout-hours: ${{ inputs.reservation-timeout-hours || '6' }}
          juju-channel: ${{ inputs.juju-channel || '3.6/stable' }}
          k8s-channel: ${{ inputs.k8s-channel || '1.34-classic/stable' }}
          gpu-operator-version: ${{ inputs.gpu-operator-version || 'v26.7.2' }}
          network-operator-version: ${{ inputs.network-operator-version || '26.7.0' }}
          vllm-controller: ${{ (inputs.up-to || 'network-operator') != 'k8s' }}
          vllm-controller-name: vllm
          tmate: ${{ github.event_name == 'push' || inputs.tmate }}

      - name: Set up Python
        if: github.event_name == 'push' || (inputs.cluster == 'tor-A100_x2_IB' && inputs.run-tests && inputs.up-to != 'k8s')
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tox envs install the test dependencies with poetry.
      - name: Install tox and poetry
        if: github.event_name == 'push' || (inputs.cluster == 'tor-A100_x2_IB' && inputs.run-tests && inputs.up-to != 'k8s')
        run: python -m pip install --quiet tox poetry

      # Under $HOME (state dir): the strictly confined juju snap cannot read
      # charm files outside it.
      - name: Download packed charm(s)
        if: github.event_name == 'push' || (inputs.cluster == 'tor-A100_x2_IB' && inputs.run-tests && inputs.up-to != 'k8s')
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true
          path: ${{ steps.setup.outputs.state-dir }}

      - name: Run GPU bundle integration tests
        if: github.event_name == 'push' || (inputs.cluster == 'tor-A100_x2_IB' && inputs.run-tests && inputs.up-to != 'k8s')
        env:
          # Credentials for the S3 bucket hosting the test model (as in ci.yaml).
          AWS_ACCESS_KEY_ID: ${{ secrets.LLM_STORAGE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LLM_STORAGE_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          # Gated hf:// model of the GPU test.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CHARMS_PATH: ${{ steps.setup.outputs.state-dir }}/charms/
          PYTEST_ARGS: ${{ inputs.pytest-args }}
        run: |
          juju switch "${{ steps.setup.outputs.vllm-controller }}"
          read -r -a extra_args <<<"$PYTEST_ARGS"
          tox -e bundle-integration-gpu -- --keep-models --charms-path="$CHARMS_PATH" "${extra_args[@]}"

      - name: Collect diagnostics
        if: always() && steps.setup.outputs.state-dir != ''
        id: diagnostics
        run: ${{ github.workspace }}/.github/actions/gpu-ib-cluster/scripts/collect-diagnostics.sh "${{ runner.temp }}/diagnostics"

      - name: Upload diagnostics
        if: always() && steps.diagnostics.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-gpu-ib-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.diagnostics.outputs.path }}
          if-no-files-found: ignore

      - name: Release cluster
        if: always()
        uses: ./.github/actions/gpu-ib-cluster/release
        with:
          release-machines: ${{ !(github.event_name != 'workflow_dispatch' || inputs.keep-reservation) }}
          testflinger-client-id: ${{ secrets.TESTFLINGER_CLIENT_ID }}
          testflinger-secret-key: ${{ secrets.TESTFLINGER_SECRET_KEY }}

      - name: Kept reservation
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.keep-reservation)
        env:
          SSH_IMPORT_IDS: ${{ steps.ssh-ids.outputs.ids }}
          HOURS: ${{ inputs.reservation-timeout-hours || '6' }}
        run: |
          {
            echo "### Reservation kept"
            echo
            echo "The machines in the table above stay reserved for up to ${HOURS}h; log in with \`${SSH_IMPORT_IDS}\`."
            echo "The runner state (kubeconfig, Juju client entries) is kept for the tmate session, if any; the runner is ephemeral. On a worker, \`sudo k8s config\` prints the kubeconfig."
            echo "Cancel early with \`testflinger-cli cancel <job-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
